# version: 1.0.0

# color codes: https://i.sstatic.net/KTSQa.png
# https://starship.rs/advanced-config/#style-strings

add_newline = true

format = """
$username\
$hostname\
$directory\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$fill \
$cmd_duration\
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cmake\
$cobol\
$daml\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$kotlin\
$gradle\
$lua\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$conda\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time
[❯ ](bold green)"""


[aws]
    disabled = false
    format = "[ $symbol$profile/$region]($style)"
    style = "bold 208"
    symbol = " "

[buf]
    symbol = "■ "
    format = " [buf](italic) [$symbol $version $buf_version]($style)"

[battery]
    format = "[ $percentage $symbol]($style)"
    full_symbol = "█"
    charging_symbol = "[↑](italic bold green)"
    discharging_symbol = "↓"
    unknown_symbol = "░"
    empty_symbol = "▃"
    disabled = true

[[battery.display]]
    threshold = 20
    style = "italic bold red"

[[battery.display]]
    threshold = 60
    style = "italic dimmed bright-purple"

[[battery.display]]
    threshold = 70
    style = "italic dimmed yellow"

[character]
    format = "$symbol "
    success_symbol = "[◎](bold italic bright-yellow)"
    error_symbol = "[○](italic purple)"
    vimcmd_symbol = "[■](italic dimmed green)"
    # not supported in zsh
    vimcmd_replace_one_symbol = "◌"
    vimcmd_replace_symbol = "□"
    vimcmd_visual_symbol = "▼"

[c]
    symbol = "ℂ "
    format = " [$symbol($version(-$name))]($style)"

[conda]
    symbol = "◯ "
    format = " conda [$symbol$environment]($style)"

[cmd_duration]
    format = "[took $duration ](italic 244)"
    disabled = false

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[directory]
# home_symbol = "⌂"
# truncation_length = 2
# truncation_symbol = "□ "
# read_only = " ◈"
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'
disabled = false


[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[fill]
symbol = '.'
style = "244"
disabled = false

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold italic bright-blue)"
style = "italic bright-blue"
truncation_symbol = "⋯"
truncation_length = 30
only_attached = true

[git_commit]
disabled = false
format = "[\\($hash$tag\\)]($style) "
only_detached = false
style = "italic bright-blue"

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic bright-blue"
format = "([\\($ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed\\)]($style))"
conflicted = "[x](italic bright-magenta)"
ahead = "[▴│[${count}](bold white)│](italic green)"
behind = "[▿│[${count}](bold white)│](italic red)"
diverged = "[d┤[${ahead_count}](regular white)│▿┤[${behind_count}](regular white)│](italic bright-magenta)"
untracked = "[u](italic green)"
stashed = "[z](italic white)"
modified = "[m](italic yellow)"
staged = "[s┤[$count](bold white)│](italic bright-cyan)"
renamed = "[r](italic bright-blue)"
deleted = "[D](italic red)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"


[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"
disabled = true

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = false

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold bright-yellow"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed ellow)'

[nodejs]
format = " [⬢ ](bold bright-green)[($version)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow italic bold"
disabled = true

# PYTHON
#
[custom.novenv]
description = "show indicator when venv is missing"
shell = ['fish', '-c']
command = """
if test -f "requirements.txt" -o -f "pyproject.toml" -o -f "poetry.lock" -o -d ".venv" -o -f "Pipfile"
    echo "(inactive)"
end
"""
when = '''test -z "$VIRTUAL_ENV" '''
format = '[$output ](red)'

[custom.venv]
description = "Show qualified virtualenv dir, if not IN the dir tree where it is resides"
# from directory ../project-name/, . ~/some/other/.venv/bin/activate -- displays 'other/.venv'
# from directory .../other/src, .../other, etc. , -- displays just .venv
shell = ['fish', '-c']
command = """
    set -lx venv (path basename (path dirname (test -n "$VIRTUAL_ENV" && echo "$VIRTUAL_ENV")))
    test -n "$venv" && echo $venv
    """
when = '''test -n "$VIRTUAL_ENV" '''
format = '[\($output\)](bold green) '


[python]
format = " [${symbol}]($style)[${version}${custom.venv}]($style)[${custom.novenv}](bold red) "
symbol = "[py](bold green)"
version_format = "${raw}"
style = "bold green"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold red"

[shell]
fish_indicator = ''
powershell_indicator = ' \[pwsh_\]'
nu_indicator = ' \[nu\]'
bash_indicator = ' \[bash\]'
unknown_indicator = 'mystery shell'
elvish_indicator = ' \[elv\]'
zsh_indicator = ' \[zsh\]'
style = 'cyan bold'
disabled = false

[sudo]
format = "[$symbol]($style)"
style = "bold italic bright-purple"
symbol = "⋈┈"
disabled = false

[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[username]
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[$user]($style) "
disabled = false
show_always = false
